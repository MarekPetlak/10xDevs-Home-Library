# Error tracking. With an empty SENTRY_DSN (local, CI) the SDK is disabled and nothing leaves the machine;
# production sets it with `fly secrets set SENTRY_DSN=...`. Release comes from SENTRY_RELEASE (the git SHA, see Dockerfile).
sentry:
    dsn: '%env(SENTRY_DSN)%'
    register_error_listener: true
    tracing:
        enabled: false
    options:
        environment: '%kernel.environment%'
        # The deployed git SHA (build arg in the deploy workflow); a build without it simply has no release.
        release: '%env(default::SENTRY_RELEASE)%'
        # No e-mail, IP, cookies or request bodies; the user id alone is attached by App\Security\SentryUserContext.
        send_default_pii: false
        enable_tracing: false
        # The SDK sends while the request finishes: bound the wait so an unreachable Sentry cannot hang an error page.
        http_connect_timeout: 1
        http_timeout: 3
        before_send: App\Sentry\DropClientErrors

when@test:
    sentry:
        # A syntactically valid fake DSN so a client is built; the spy transport keeps every event in memory.
        dsn: 'https://public@sentry.invalid/1'
        # PHPUnit fails a test that leaves global PHP error handlers behind; the kernel listener is what the tests exercise.
        register_error_handler: false
        options:
            transport: App\Tests\Support\SpyTransport
