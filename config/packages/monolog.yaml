monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - auth # Failed and throttled sign-ins (App\Security\LoginFailureLogger); always logged in prod, see below

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            # Explicit error logs (readiness failure, domain failures) go to Sentry. Not behind fingers_crossed, and the
            # `request` channel is skipped: uncaught exceptions are already reported by the SDK error listener.
            sentry:
                type: service
                id: Sentry\Monolog\Handler
                channels: ["!request", "!event"]
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Explicit error logs (readiness failure, domain failures) go to Sentry. Not behind fingers_crossed, and the
            # `request` channel is skipped: uncaught exceptions are already reported by the SDK error listener.
            sentry:
                type: service
                id: Sentry\Monolog\Handler
                channels: ["!request", "!event"]
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!auth"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # Not behind fingers_crossed: warnings would be dropped unless an error happens in the same request.
            auth:
                type: stream
                channels: [auth]
                level: warning
                path: php://stderr
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
