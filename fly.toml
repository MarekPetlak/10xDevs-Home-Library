app = "10xdevs-home-library"
primary_region = "fra"   # or "waw" per D6

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "prod"
  TRUSTED_PROXIES = "REMOTE_ADDR"
  DEFAULT_URI = "https://10xdevs-home-library.fly.dev"   # replace with the D4 hostname in Phase 6
  # secrets (APP_SECRET, DATABASE_URL, MAILER_DSN) go to `fly secrets`

[deploy]
  strategy = "rolling"
  release_command = "bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration"
  release_command_timeout = "5m"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "get"
    path = "/healthz"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
